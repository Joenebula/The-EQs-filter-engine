name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure -V

      - name: Validate the VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath ./pluginval/pluginval.exe -Wait -PassThru -NoNewWindow -ArgumentList @(
            '--strictness-level', '5', '--output-dir', 'pluginval-logs',
            '--validate', 'build/Source/ParaEQ_artefacts/Release/VST3/ParaEQ.vst3')
          Write-Host "pluginval exit code: $($p.ExitCode)"
          Get-ChildItem pluginval-logs -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 30 }
          exit $p.ExitCode

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-log
          path: pluginval-logs
          if-no-files-found: ignore

      # The folder above ParaEQ.vst3 is uploaded, so the downloaded zip
      # unpacks straight to a ready-to-install ParaEQ.vst3 folder.
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ParaEQ-VST3-Windows-x64
          path: build/Source/ParaEQ_artefacts/Release/VST3/
